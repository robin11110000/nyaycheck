# Merge into your self-hosted Otari config; set real provider credentials there.
# Confirm these catalog model IDs with GET /api/v1/models on your deployment.
default_pricing: true
budgets:
  nyaycheck-free:
    max_budget: 0.50
    reset_alignment: calendar_day
    rpm_limit: 10
  nyaycheck-global:
    max_budget: 10
    reset_alignment: calendar_day
api_keys:
  nyaycheck:
    secret: ${NYAYCHECK_SERVICE_KEY}
    user_id: nyaycheck
    is_service_key: true
    end_user_budget_ids: [nyaycheck-free]
    end_user_budget_id: nyaycheck-free
    ceiling: nyaycheck-global
routing:
  policies:
    nyaycheck-vision:
      select:
        - default: ovhcloud:Qwen2.5-VL-72B-Instruct
      on_failure:
        - ovhcloud:Meta-Llama-3_3-70B-Instruct
    nyaycheck-reason:
      select:
        - default: ovhcloud:Meta-Llama-3_3-70B-Instruct
      on_failure:
        - ovhcloud:Qwen2.5-VL-72B-Instruct
    nyaycheck-failure-demo:
      select:
        - default: groq:llama-deliberately-invalid-nyaycheck
      on_failure:
        - ovhcloud:Qwen2.5-VL-72B-Instruct
# Also enable a sandbox and its per-call price, a search provider and its price,
# web fetch and its price, and a gateway input guardrail profile in the dashboard.
# Do not deploy this example unchanged; provider/model availability is deployment-specific.
